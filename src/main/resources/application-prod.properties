# Oracle Cloud Autonomous Database Configuration (Production)
spring.datasource.url=jdbc:oracle:thin:@communitydb_tp?TNS_ADMIN=./src/main/resources/wallet
spring.datasource.username=ADMIN
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Inherits AWS and Stripe keys from application.properties
