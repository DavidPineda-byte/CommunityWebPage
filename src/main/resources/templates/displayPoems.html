<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Poems</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/displayPoems.css(v=${#dates.createNow().time})}">
</head>
<body>
<nav id="mainNav" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid d-flex align-items-center">

        <div class="flex-grow-1"></div>

        <a class="navbar-brand brand-logo mx-auto text-center" href="#">
            The Midnight Notebook
        </a>

        <form id="poemSearchForm" class="d-flex flex-grow-1 justify-content-end">
            <input class="form-control me-2 w-75" type="search" placeholder="Search poems...">
            <button class="btn btn-outline-light">Search</button>
        </form>

    </div>
</nav>
<div class="container my-4">
    <h1 class="mb-4 text-center">Poems</h1>

    <div class="row g-4">
        <div class="col-md-4" th:each="poem : ${poems}">
            <div class="card h-100 shadow-sm" th:attr="data-id=${poem.id}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${poem.title}">Title</h5>
                    <h6 class="card-subtitle mb-2 text-muted" th:text="${poem.author}">Author</h6>
                    <h6 class="card-subtitle mb-2 text-muted" th:text="${poem.genre}">Genre</h6>
                    <p class="card-text description"
                       th:text="${poem.description}"
                       style="display:none;"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="poemModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted" id="modalAuthor"></p>
                <p id="modalContent" style="white-space: pre-line"></p>
            </div>
        </div>
    </div>
</div>

<script src="/js/poem.js" th:src="@{/js/poem.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
