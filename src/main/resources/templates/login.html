<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container-fluid">
    <div class="row vh-100">

        <!-- LEFT SECTION -->
        <div class="col-md-6 d-flex flex-column justify-content-center px-5">

            <h2 class="fw-bold mb-3 text-primary">
                Login and read some poems
            </h2>

            <p class="text-muted">Welcome back! Please login to your account.</p>

            <form th:action="@{/login}" method="post" class="mt-4">

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password">
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label" for="remember">Remember Me</label>
                    </div>

                    <a href="#" class="text-decoration-none text-primary">Forgot Password?</a>
                </div>

                <div class="d-flex gap-3">
                    <button type="submit" class="btn btn-primary px-4">Login</button>
                    <a href="/register" class="btn btn-outline-primary px-4">Register</a>                </div>

            </form>

            <!-- SOCIAL LOGIN -->
            <div class="mt-4">
                <small class="text-muted">Or login with</small>
                <div class="d-flex gap-3 mt-2">
                    <a class="text-primary" href="#">Facebook</a>
                    <a class="text-primary" href="#">LinkedIn</a>
                    <a class="text-primary" href="#">Google</a>
                </div>
            </div>

        </div>

        <!-- RIGHT SECTION -->
        <div class="col-md-6 bg-white d-flex flex-column justify-content-center align-items-center">

            <!-- Navigation -->
            <nav class="mb-5">
                <ul class="nav">
                    <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about">About us</a></li>
                    <li class="nav-item"><a class="nav-link" href="/blog">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pricing">Pricing</a></li>
                </ul>
            </nav>

            <!-- Illustration (replace with your own) -->
            <img src="/assets/img/login.jpg" class="img-fluid" style="max-width: 70%;">
        </div>

    </div>
</div>

</body>
</html>
