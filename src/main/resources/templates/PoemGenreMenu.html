<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Genres</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/displayPoems.css(v=${#dates.createNow().time})}">
</head>
<body>
<nav id="mainNav" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid d-flex align-items-center">

        <button type="button" class="btn btn-outline-light me-3" data-bs-toggle="modal" data-bs-target="#addGenreModal">
            Add Genre
        </button>

        <a class="navbar-brand brand-logo mx-auto text-center" href="#">
            The Midnight Notebook
        </a>

        <form id="poemSearchForm" class="d-flex flex-grow-1 justify-content-end">
            <input class="form-control me-2 w-75" type="search" placeholder="Search poems...">
            <button class="btn btn-outline-light">Search</button>
        </form>

    </div>
</nav>
<div class="container my-4">
    <h1 class="mb-4 text-center">Genres</h1>
    <div class="row g-4">
        <div class="col-md-4" th:each="genre : ${genres}">
            <div class="card h-100 shadow-sm" th:attr="data-id=${genre.id}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${genre.name}">Title</h5>
                    <p class="card-text description"
                       th:text="${genre.description}"
                       style="display:none;"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addGenreModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="addGenreForm" th:object="${genre}" th:action="@{/poem/addGenre}" method="post">
            <div class="modal-header">
                <h5 class="modal-title">Add Genre</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                    <input class="form-control me-2 w-75" th:field="*{name}" type="text" placeholder="Add a new Genre!">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="submit" class="btn btn-primary">Save changes</button>
            </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
