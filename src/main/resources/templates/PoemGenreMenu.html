<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Genres</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/displayPoems.css}">
</head>
<body>

<nav id="mainNav" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid d-flex align-items-center">

        <div sec:authorize="hasRole('ADMIN')">
            <button type="button"
                    class="btn btn-outline-light me-3"
                    data-bs-toggle="modal"
                    data-bs-target="#addGenreModal">
                Add Genre
            </button>
        </div>

        <a class="navbar-brand brand-logo mx-auto text-center" href="#">
            The Midnight Notebook
        </a>

        <form id="poemSearchForm" class="d-flex flex-grow-1 justify-content-end">
            <input class="form-control me-2 w-75" type="search" placeholder="Search poems...">
            <button class="btn btn-outline-light">Search</button>
        </form>

    </div>
</nav>

<!-- Description -->
<div>
    <p class="lead text-center fs-3 mx-auto" style="width: 75%;" id="genreLeadParagraph">
        Choose the topic which you want to experience.
        Each Genre holds poems which will speak directly to your soul,
        helping it inspire, heal, or direct you to a new path
    </p>
</div>

<!-- Genres -->
<div class="container my-5" style="max-width: 900px;">
    <h1 class="mb-5 text-center">Genres</h1>

    <div id="card-container" class="d-flex flex-wrap justify-content-center gap-4">
        <div th:each="genre : ${genres}">
            <div class="card shadow-sm genre-card" th:attr="data-id=${genre.id}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${genre.name}">Title</h5>
                    <p class="card-text description"
                       th:text="${genre.description}"
                       style="display:none;"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="addGenreModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="addGenreForm" th:object="${genre}" th:action="@{/poem/addGenre}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Add Genre</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input class="form-control"
                           th:field="*{name}"
                           type="text"
                           placeholder="Add a new Genre!">
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/poemGenreListener.js}"></script>
</body>
</html>
